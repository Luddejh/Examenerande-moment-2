    <div class="form-container">
      <form
        action="https://formsubmit.co/468885a99bfdcd49011ec0b1d5ff67fb"

      >
        <!-- FormSubmit-inställningar -->
        <!-- Localhost med Live Server -->
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_template" value="table" />
        <input
          type="hidden"

        <!-- Om man har lagt upp sidan på Internet... -->

        <!-- Förnamn -->
        <label for="firstName">Förnamn</label>
        <input
          type="text"
          id="firstName"
          name="Förnamn"
          required
          minlength="2"
          pattern="[A-Za-zÅÄÖåäö\- ]+"
          placeholder="Ange ditt förnamn (minst 2 bokstäver)"
        />

        <!-- Efternamn -->
        <label for="lastName">Efternamn</label>
        <input
          type="text"
          id="lastName"
          name="Efternamn"
          required
          minlength="2"
          pattern="[A-Za-zÅÄÖåäö\- ]+"
          placeholder="Ange ditt efternamn (minst 2 bokstäver)"
        />

        <!-- E-post -->
        <!-- Pattern kontrollerar:
          minst ett tecken före @
          minst ett tecken efter @
          minst en punkt i slutet
          Dokumentation: https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/pattern -->
        <label for="email">E-post</label>
        <input
          type="email"
          id="email"
          name="E-post"
          required
          pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
          placeholder="namn@example.com"
        />

        <button type="submit">Skicka</button>
      </form>
